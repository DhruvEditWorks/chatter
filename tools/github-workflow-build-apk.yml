name: Build APK

# Builds installable Chatter APKs (debug + signed release) and commits them
# to dist/, together with a build status file.
on:
  push:
    paths:
      - 'android/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'index.html'
      - 'contacts.json'
      - 'upcoming_replies.txt'
      - 'avatars/**'
      - 'Favicon/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Prepare web assets
        run: python3 tools/prepare_www.py

      - name: Build debug + release APKs
        working-directory: android
        run: |
          set +e
          gradle :app:assembleDebug :app:assembleRelease --console=plain 2>&1 | tee ../gradle-build.log
          echo "GRADLE_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0

      - name: Collect APKs + status
        if: always()
        run: |
          mkdir -p dist
          cp -f android/app/build/outputs/apk/debug/app-debug.apk dist/chatter-debug.apk 2>/dev/null || true
          cp -f android/app/build/outputs/apk/release/app-release.apk dist/chatter-release.apk 2>/dev/null || true
          {
            echo "Chatter APK build"
            echo "================="
            echo "date:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit: $GITHUB_SHA"
            echo "run:    $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "gradle exit: ${GRADLE_EXIT:-unknown}"
            echo ""
            echo "artifacts:"
            ls -la dist/ || true
            echo ""
            echo "--- gradle log (tail) ---"
            tail -n 60 gradle-build.log 2>/dev/null || echo "(no log)"
          } > dist/BUILD_STATUS.txt
          cat dist/BUILD_STATUS.txt

      - name: Commit APKs back to the repo
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "chatter-apk-bot"
          git config user.email "chatter-apk-bot@users.noreply.github.com"
          git add -A dist/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build APKs (run #${GITHUB_RUN_NUMBER}) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatter-apks
          path: |
            dist/*.apk
            dist/BUILD_STATUS.txt
          if-no-files-found: warn

      - name: Fail the run if Gradle failed
        if: always() && env.GRADLE_EXIT != '0'
        run: |
          echo "Gradle build failed with exit code ${GRADLE_EXIT}."
          exit 1
